name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Verify package version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version=$(uv run python -c "import pymolt; print(pymolt.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package version ($pkg_version)"
            exit 1
          fi
          echo "Verified tag version $tag_version matches package version $pkg_version"
      - name: Build sdist and wheel
        run: uv build
      - name: Guard against non-package content in the sdist
        # Axiom Graph is a separate service and must never ship in the pymolt sdist.
        run: |
          leaked=$(tar tzf dist/*.tar.gz | grep -E '/(services|bench|docs|integrations|plugin|tests)/' || true)
          if [ -n "$leaked" ]; then
            echo "::error::sdist contains files outside the pymolt package:"
            echo "$leaked"
            exit 1
          fi
      - name: twine check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC) — no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
