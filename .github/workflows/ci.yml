name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job names are the required status checks on main and release/*.
  # Renaming a job means updating the branch ruleset too.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The suite assumes the interpreter it runs on is the lowest Python a
          # project may declare (3.12); under 3.13 two assess tests fail.
          python-version: "3.12"
          enable-cache: true
      - name: pytest
        run: uv run --extra dev pytest -q

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Check the distributions
        run: .github/scripts/check_dist.sh
