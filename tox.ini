# tox — version matrix for the verify/ INJECTED RUNTIME only (pure stdlib).
#
# SCAFFOLD (DoD §5): the injected tracer is loaded inside the target app's interpreter, which
# may be as old as Python 3.6 (the flasgger devcontainer). These envs prove the pure-stdlib
# modules — _normalize, _backend, _sinks, boundary_tracer — import and behave on 3.6-3.11.
# The HOST core (cascade/coverage/golden_master/diff/models, Pydantic) targets >=3.12 and is
# covered by the main `pytest tests/verify` run, NOT here.
#
# [CONFIRM] CI infra: only Python 3.11 and 3.12 are available on the dev host, so 3.6-3.10
# are not executed locally — run this matrix in CI (or the devcontainer) where those
# interpreters exist. No third-party deps are installed: the injected runtime must stand alone.

[tox]
envlist = py36, py37, py38, py39, py310, py311
skipsdist = true

[testenv]
description = injected-runtime unit tests (pure stdlib, no deps)
deps = pytest
# Only the runtime-layer tests — they import nothing beyond stdlib + pytest.
commands =
    pytest -q \
        tests/verify/test_normalize.py \
        tests/verify/test_sinks.py \
        tests/verify/test_backend.py
setenv =
    PYTHONPATH = {toxinidir}
