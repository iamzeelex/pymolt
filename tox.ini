# tox: the injected runtime's tests on old interpreters (pure stdlib plus pytest).
#
# The tracer loads inside the project's own interpreter, as old as Python 3.6, so its modules
# must parse and behave there. CI runs the same list on 3.6 and 3.7 in python:3.x-slim
# containers (`runtime-old` in .github/workflows/ci.yml); 3.8 and 3.11 run inside the main suite.
# The list is tests/runtime_old_pythons.txt. `--noconftest` skips the host conftest, which
# imports pydantic.

[tox]
envlist = py36, py37, py38, py39, py310, py311
skipsdist = true

[testenv]
description = injected-runtime tests (pure stdlib, no deps)
deps = pytest
allowlist_externals = sh
commands =
    sh -c 'python -m pytest -q -rs --noconftest -p no:cacheprovider $(cat tests/runtime_old_pythons.txt)'
setenv =
    PYTHONPATH = {toxinidir}
