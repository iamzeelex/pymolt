# Axiom Graph — codemod-pattern service + Neo4j evolution-graph store.
#
#   docker compose up --build           # neo4j + axiom on :8000, browser on :7474
#   curl localhost:8000/health
#   curl -X POST localhost:8000/codemods -H 'content-type: application/json' \
#        -d '{"dependencies":[{"name":"flask","from_version":"2.0.3","to_version":"3.0.0"}]}'
#
# The axiom service persists every run's patterns into Neo4j (AXIOM_GRAPH_STORE);
# the boundary is unchanged — only patterns are stored, never user code.
#
# Batch coverage runs use the dedicated `bench` service (no web healthcheck),
# one process per library:
#   docker compose -p axiom_graph run --rm bench \
#       --pairs /out/top_pypi.txt --store-from-env --workers 4 --out /out/report.json

services:
  neo4j:
    image: neo4j:5
    environment:
      # Neo4j 5 requires a password of at least 8 characters.
      NEO4J_AUTH: neo4j/axiomsecret
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      # cypher-shell ships in the image; succeeds only once bolt is serving.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p axiomsecret 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  axiom:
    build: .
    environment:
      AXIOM_GRAPH_STORE: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: axiomsecret
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Batch coverage harness — same image as `axiom`, but a one-shot job, not a
  # server: the web healthcheck is disabled so it never shows as "unhealthy".
  # Started on demand only (profile), never by a plain `docker compose up`.
  bench:
    build: .
    profiles: ["batch"]
    environment:
      AXIOM_GRAPH_STORE: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: axiomsecret
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./out:/out
    healthcheck:
      disable: true
    entrypoint: ["python", "-m", "axiom_graph.benchmark.bench"]

volumes:
  neo4j-data: {}
